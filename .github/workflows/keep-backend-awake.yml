# The backend is a free HuggingFace Space, which sleeps after 48 hours idle and
# then needs ~30s to wake. On a quiet app that means the first visitor triggers a
# page render against a sleeping backend — the library comes back empty and that
# empty render gets cached. Pinging every 6 hours keeps the space from ever
# reaching its 48-hour idle timeout.
name: Keep backend awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
              https://sabter-ai-mufti-backend.hf.space/health || true)
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "backend did not answer 200 after 3 attempts"
          exit 1
